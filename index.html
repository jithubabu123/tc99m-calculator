<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Doe | Personal Profile</title>
    <meta name="description" content="Personal profile page for John Doe showcasing name, portrait, and short bio.">
    <style>
        :root {
            color-scheme: light;
            --bg-gradient: radial-gradient(circle at top left, #cce5ff 0%, rgba(255, 255, 255, 0) 55%),
                radial-gradient(circle at bottom right, #ffe8cc 0%, rgba(255, 255, 255, 0) 60%);
            --bg-base: #f4f6fb;
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: rgba(15, 23, 42, 0.08);
            --heading: #1d2a44;
            --text: #4a5568;
            --accent: #2563eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: clamp(2rem, 4vw, 4rem);
            background: var(--bg-base);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text);
        }

        main {
            width: min(420px, 100%);
        }

        .profile-card {
            position: relative;
            display: grid;
            gap: 1.75rem;
            padding: clamp(2rem, 5vw, 3rem);
            border-radius: 28px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 45px rgba(29, 42, 68, 0.14);
            overflow: hidden;
        }

        .profile-card::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.08), rgba(15, 118, 110, 0.07));
            mix-blend-mode: screen;
        }

        figure {
            margin: 0;
            display: grid;
            justify-items: center;
            gap: 1rem;
        }

        .portrait {
            width: clamp(160px, 42vw, 190px);
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 16px 35px rgba(37, 99, 235, 0.25);
        }

        figcaption {
            font-size: 0.95rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(74, 85, 104, 0.7);
        }

        header {
            display: grid;
            gap: 0.75rem;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.35rem, 5vw, 2.8rem);
            font-weight: 700;
            color: var(--heading);
            letter-spacing: -0.01em;
        }

        .tagline {
            margin: 0 auto;
            max-width: 28ch;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .tagline .accent {
            color: var(--accent);
            font-weight: 600;
        }

        .contact {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
        }

        .contact a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .contact a:hover,
        .contact a:focus {
            text-decoration: underline;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <main aria-labelledby="profile-name">
        <article class="profile-card">
            <figure>
                <img class="portrait" src="https://images.unsplash.com/photo-1527980965255-d3b416303d12?auto=format&fit=crop&w=400&q=80" alt="Portrait of John Doe smiling in front of a neutral background" loading="lazy">
                <figcaption>Portrait</figcaption>
            </figure>
            <header>
                <h1 id="profile-name">John Doe</h1>
                <p class="tagline">Creative technologist, educator, and lifelong learner crafting <span class="accent">human-centered digital experiences</span>.</p>
            </header>
            <nav class="contact" aria-label="Contact links">
                <a href="mailto:john.doe@example.com">Email</a>
                <a href="https://www.linkedin.com" target="_blank" rel="noopener">LinkedIn</a>
                <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
            </nav>
        </article>
    </main>
</body>
</html>
